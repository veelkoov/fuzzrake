---
- name: "Setup Yarn 1 repository"
  ansible.builtin.yum_repository:
    baseurl: "https://dl.yarnpkg.com/rpm/"
    description: "Yarn Repository"
    enabled: "1"
    gpgcheck: "1"
    gpgkey: "https://dl.yarnpkg.com/rpm/pubkey.gpg"
    name: "yarn"

- name: "Enable epel-release"
  ansible.builtin.dnf:
    name: "epel-release"
    state: "installed"

- name: "Install required packages"
  ansible.builtin.dnf:
    name:
      - "certbot"
      - "dnf-automatic"
      - "firewalld"
      - "git"
      - "nodejs24"
      - "python3-certbot-apache"
      - "python3-firewall"
      - "vim"
      - "yarn"
    state: "installed"

- name: "Enable firewalld"
  ansible.builtin.service:
    enabled: true
    name: "firewalld"
    state: "started"

- name: "Remove unused cockpit service"
  ansible.posix.firewalld:
    immediate: true
    permanent: true
    service: "cockpit"
    state: "disabled"

- name: "Disable rpcbind"
  ansible.builtin.service:
    enabled: false
    name: "{{ item }}"
    state: "stopped"
  loop:
    - "rpcbind.socket"
    - "rpcbind.service"

- name: "Disable SELinux"
  ansible.builtin.lineinfile:
    line: "SELINUX=disabled"
    path: "/etc/selinux/config"
    regex: "^SELINUX="
  notify:
    - "Reload system"

- name: "Setup hostname"
  ansible.builtin.hostname:
    name: "{{ fqdn }}"
    use: "systemd"

- name: "Enable auto-restart after updating"
  ansible.builtin.lineinfile:
    insertafter: '^\[commands\]$'
    line: "reboot = when-changed"
    path: "/etc/dnf/automatic.conf"
    regexp: "^reboot *="

- name: "Enable dnf-automatic-install.timer"
  ansible.builtin.systemd_service:
    enabled: true
    name: "dnf-automatic-install.timer"
    state: "started"
