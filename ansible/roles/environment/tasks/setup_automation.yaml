---
- name: "Setup systemd services"
  loop: "{{ environment_systemd_services }}"
  ansible.builtin.template:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    src: "{{ item.template_src }}"
  register: "environment_cmd_res"

- name: "Reload systemd daemon"
  ansible.builtin.systemd_service:
    daemon_reload: "{{ environment_cmd_res.changed }}"

- name: "Enable and (re)start systemd services"
  loop: "{{ environment_cmd_res.results }}"
  when: item.item.enable
  ansible.builtin.systemd_service:
    enabled: true
    name: "{{ item.item.name }}"
    state: '{{ "restarted" if item.changed else "started" }}'
