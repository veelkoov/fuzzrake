---
- name: "Execute: composer install --no-dev"
  ansible.builtin.command:
    cmd: "docker exec {{ php_fpm_container_name | quote }} composer install --no-dev"
  register: "environment_cmd_res"
  changed_when: '"Nothing to install, update or remove" not in environment_cmd_res.stdout'

- name: "Execute: pnpm install --prod"
  ansible.builtin.command:
    cmd: "docker exec {{ php_fpm_container_name | quote }} pnpm install --prod"
  register: "environment_cmd_res"
  changed_when: '"success Already up-to-date." not in environment_cmd_res.stdout'

- name: "Execute: pnpm encore production"
  ansible.builtin.command:
    cmd: "docker exec {{ php_fpm_container_name | quote }} pnpm encore production"
  changed_when: "not ansible_check_mode" # TODO: Make it real (if possible)
